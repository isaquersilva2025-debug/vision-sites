<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | Transformando Ideias em Presença Digital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            /* PALETA DE CORES NEXORA (VERMELHO NEON) */
            --bg-deep: #050505;
            --bg-card: #0e0e11;
            --bg-card-hover: #16161a;
            --border-color: rgba(255, 255, 255, 0.08);
            
            /* Vermelhos ajustados para o efeito neon */
            --primary-red: #eb1616;
            --bright-red: #ff1f1f;
            --glow-red: rgba(255, 31, 31, 0.6);
            
            --pure-white: #ffffff;
            --text-main: #f4f4f5;
            --text-muted: #94a3b8;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* CANVAS DE PARTÍCULAS NO FUNDO (Agora avermelhadas) */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        header, section, footer {
            position: relative;
            z-index: 2;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* HEADER PREMIUM */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .header-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--pure-white);
            text-transform: uppercase;
        }

        /* LOGO NEXORA - EFECTO NEON VERMELHO */
        .logo-icon {
            width: 45px;
            height: 45px;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            position: relative;
            cursor: pointer;
            transition: var(--transition-smooth);
            
            /* O SEGREDO: Efeito de brilho vermelho neon */
            text-shadow: 
                0 0 10px rgba(235, 22, 22, 0.8),
                0 0 20px rgba(235, 22, 22, 0.6),
                0 0 40px rgba(235, 22, 22, 0.4);
        }

        .logo-icon::before {
            content: 'N';
            background: linear-gradient(135deg, #ffffff 0%, #ffcccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo:hover .logo-icon {
            transform: scale(1.1) rotate(-5deg);
            text-shadow: 
                0 0 15px rgba(255, 31, 31, 1),
                0 0 30px rgba(235, 22, 22, 0.8),
                0 0 50px rgba(235, 22, 22, 0.6);
        }

        .logo-text {
            color: var(--pure-white);
            font-weight: 700;
        }

        .logo-text .highlight {
            color: var(--bright-red);
            text-shadow: 0 0 10px var(--glow-red);
        }

        .nav-menu ul {
            display: flex;
            gap: 2.5rem;
        }

        .nav-menu a {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--bright-red);
            box-shadow: 0 0 8px var(--bright-red);
            transition: var(--transition-smooth);
        }

        .nav-menu a:hover {
            color: var(--pure-white);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-primary {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.6rem;
            background: linear-gradient(135deg, var(--primary-red), var(--bright-red));
            color: var(--pure-white);
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 25px var(--glow-red);
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 35px rgba(255, 31, 31, 0.6);
        }

        /* HERO */
        .hero {
            padding: 180px 0 100px;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at center top, rgba(235, 22, 22, 0.12), transparent 70%);
        }

        .hero h1 {
            font-size: 3.6rem;
            font-weight: 800;
            letter-spacing: -2px;
            max-width: 850px;
            margin: 0 auto 1.5rem;
            line-height: 1.15;
            color: var(--pure-white);
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--bright-red), #ff7b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 31, 31, 0.3));
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto 2.5rem;
            padding: 0 1rem;
        }

        /* VANTAGENS */
        .benefits-section {
            padding: 70px 0;
            background: rgba(5, 5, 8, 0.5);
        }

        .section-title {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 0.75rem;
            color: var(--pure-white);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .benefit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .benefit-card:hover {
            border-color: rgba(255, 31, 31, 0.4);
            transform: translateY(-5px);
            background: var(--bg-card-hover);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .benefit-icon {
            width: 50px;
            height: 50px;
            background: rgba(235, 22, 22, 0.1);
            border: 1px solid rgba(235, 22, 22, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bright-red);
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(235, 22, 22, 0.2);
        }

        .benefit-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--pure-white);
        }

        .benefit-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* PORTFÓLIO */
        .portfolio-section {
            padding: 80px 0;
        }

        .portfolio-filters {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(235, 22, 22, 0.15);
            border-color: var(--bright-red);
            color: var(--pure-white);
            box-shadow: 0 0 15px rgba(235, 22, 22, 0.25);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.75rem;
        }

        .portfolio-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
        }

        .portfolio-card.hide {
            display: none !important;
        }

        .portfolio-card:hover {
            border-color: rgba(255, 31, 31, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .portfolio-image {
            height: 220px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* Barra de Navegação do Mini-Browser */
        .browser-topbar {
            height: 28px;
            background: #1e1e24;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .b-dot { width: 7px; height: 7px; border-radius: 50%; }
        .b-dot-r { background: #ff5f56; }
        .b-dot-y { background: #ffbd2e; }
        .b-dot-g { background: #27c93f; }
        .b-url {
            background: #111116;
            flex-grow: 1;
            height: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 0.6rem;
            color: #888;
        }

        /* 1. MOCKUP GOURMET */
        .mock-gourmet {
            background: #fdfbf7;
            color: #111;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
